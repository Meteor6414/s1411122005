<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習題</title>
</head>

<body>
    <form>
        <p>姓名: <input type="text" name="userName" size="20"></p>
        <p>
            <input type="radio" name="userAge" value="age1">未滿20歲
            <input type="radio" name="userAge" value="age2" checked>20~29
            <input type="radio" name="userAge" value="age3">30歲或以上
        </p>
        <p>您使用過那些業者的門號呢?(可複選)
            <input type="checkbox" name="userNumber[]" value="中華電信" checked>中華電信
            <input type="checkbox" name="userNumber[]" value="台灣大哥大">台灣大哥大
            <input type="checkbox" name="userNumber[]" value="遠傳">遠傳
            <input type="checkbox" name="userNumber[]" value="台灣之星">台灣之星
        </p>
        <p>您使用過那些廠牌的手機呢?(可複選)
            <select name="userPhone" size="4" multiple>
                <option value="ASUS"selected>ASUS
                <option value="Apple"selected>Apple
                <option value="hTC"selected>hTC
                <option value="SONY"selected>SONY
            </select>
        </p>
        <input type="submit" value="提交">
        <input type="reset" value="重新輸入">
    </form>
</body>
</html>
